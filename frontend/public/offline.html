<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline – Little Learner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0f0f23 0%, #1a1a35 100%);
      font-family: 'Nunito', sans-serif;
      color: white; padding: 24px; text-align: center;
    }
    .emoji { font-size: 80px; margin-bottom: 24px; animation: float 3s ease-in-out infinite; }
    h1 { font-size: 28px; font-weight: 900; margin-bottom: 12px; }
    p { color: rgba(255,255,255,0.6); font-size: 16px; line-height: 1.6; max-width: 340px; margin-bottom: 32px; }
    .badge { background: rgba(78,205,196,0.15); border: 1px solid rgba(78,205,196,0.3); border-radius: 99px; padding: 8px 20px; color: #4ECDC4; font-weight: 800; font-size: 14px; }
    button { margin-top: 16px; padding: 14px 28px; background: linear-gradient(135deg, #6C63FF, #5854e0); color: white; border: none; border-radius: 99px; font-size: 16px; font-weight: 800; cursor: pointer; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  </style>
</head>
<body>
  <div class="emoji">🌟</div>
  <h1>You're Offline!</h1>
  <p>
    Don't worry! Your learning progress is safely saved on this device.
    Connect to the internet and we'll sync everything up!
  </p>
  <div class="badge">✓ Progress saved on device</div>
  <button onclick="location.reload()">Try Again</button>
</body>
</html>
